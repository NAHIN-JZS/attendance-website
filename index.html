<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12233d">
<!-- Ask the browser to re-check this file every visit. GitHub Pages otherwise
     lets Chrome hold a copy for ten minutes, which makes updates look broken. -->
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Class attendance</title>

<script>
/* ------------------------------------------------------------------ *
 *  PASTE YOUR APPS SCRIPT WEB APP URL BETWEEN THE QUOTES BELOW.
 *  It looks like: https://script.google.com/macros/s/AKfy..../exec
 * ------------------------------------------------------------------ */
const API = "https://script.google.com/macros/s/AKfycbwrBkHXc2CH3tiFCN4ZKHIn45uArzrxGAudgWbbSjqLN8PLckGSOqg4AwH2Mt2C7O-p/exec";

/*  Bumped whenever this file changes. Shown in the header so you can tell
    at a glance whether the browser is serving the newest copy. */
const BUILD = "2026-08-17d";

/*  Shown in the header — change to whatever you like. */
const HEADER_TITLE = "Attendance";
const HEADER_SUB   = "Department of CSE";

/*  Students below this percentage are flagged in the summary. */
const PASS_MARK = 75;

/*  How many class slots a single day can have. */
const CLASSES_PER_DAY = 4;

/*  Letter grades, highest first: [percentage needed, letter, grade point].
 *  This is the usual UGC scale — edit it to match your department. */
const GRADE_SCALE = [
  [80, 'A+', 4.00], [75, 'A', 3.75], [70, 'A-', 3.50], [65, 'B+', 3.25],
  [60, 'B',  3.00], [55, 'B-', 2.75], [50, 'C+', 2.50], [45, 'C', 2.25],
  [40, 'D',  2.00], [0,  'F',  0.00]
];
</script>

<style>
:root{
  --ink:#12233d; --ink-2:#33455f; --muted:#6b7a90;
  --paper:#fff; --wash:#f2f5f9; --line:#dde3ec;
  --p:#0f7a4d; --p-bg:#e4f4ea;
  --l:#a4620b; --l-bg:#fcefda;
  --e:#1b5f8f; --e-bg:#e2eef7;
  --a:#b32a45; --a-bg:#fbe6ea;
  --mono:ui-monospace,"SF Mono",Menlo,"Roboto Mono","DejaVu Sans Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--sans);background:var(--wash);color:var(--ink);
  -webkit-text-size-adjust:100%;padding-bottom:24px}
body.marking{padding-bottom:96px}
.wrap{max-width:720px;margin:0 auto;padding:0 14px}

/* header + tabs */
header{background:var(--ink);color:#fff;padding:18px 0 0}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{margin:0;font-size:20px;font-weight:650;letter-spacing:-.01em}
.brand span{font-size:12.5px;color:#9db0cb;letter-spacing:.02em}
.tabs{display:flex;gap:20px;margin-top:14px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{font:inherit;font-size:14px;font-weight:600;white-space:nowrap;background:0;
  border:0;color:#9db0cb;padding:0 0 10px;border-bottom:2px solid transparent;cursor:pointer}
.tabs button[aria-selected="true"]{color:#fff;border-bottom-color:#fff}

/* cards + fields */
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;
  padding:14px;margin-top:14px}
.fields{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.fields.one{grid-template-columns:1fr}
.fields.three{grid-template-columns:1fr 140px 110px}
.fields.add{grid-template-columns:130px 1fr auto;align-items:end}
@media (max-width:560px){
  .fields.three{grid-template-columns:1fr 1fr}
  .fields.three>div:first-child{grid-column:1/-1}
  .fields.add{grid-template-columns:1fr 1fr}
  .fields.add>div:nth-child(2){grid-column:1/-1}
}
label{display:block;font-size:11.5px;font-weight:650;letter-spacing:.05em;
  text-transform:uppercase;color:var(--muted);margin-bottom:5px}
select,input{width:100%;font:inherit;font-size:15px;padding:9px 10px;color:var(--ink);
  background:var(--paper);border:1px solid var(--line);border-radius:8px}
select:focus-visible,input:focus-visible,button:focus-visible{
  outline:2px solid var(--ink);outline-offset:2px}
.tools{display:flex;gap:8px;margin-top:12px;align-items:center;flex-wrap:wrap}
.ghost{font:inherit;font-size:13.5px;font-weight:600;white-space:nowrap;
  padding:9px 12px;border-radius:8px;border:1px solid var(--line);
  background:var(--paper);color:var(--ink-2);cursor:pointer}
.ghost:hover{background:var(--wash)}
.ghost.danger{color:var(--a);border-color:#eebfc8}
.ghost.danger:hover{background:var(--a-bg)}
.ghost:disabled{opacity:.45;cursor:default}
.check{display:flex;align-items:center;gap:7px;font-size:13.5px;color:var(--ink-2);
  cursor:pointer;user-select:none}
.check input{width:auto;margin:0}

/* shared list */
ul{list-style:none;margin:14px 0 0;padding:0;background:var(--paper);
  border:1px solid var(--line);border-radius:12px;overflow:hidden}
li{display:flex;align-items:center;gap:12px;padding:9px 12px;
  border-top:1px solid var(--line);border-left:4px solid transparent}
li:first-child{border-top:0}
li.hide{display:none}
li[data-s="P"]{border-left-color:var(--p)}
li[data-s="L"]{border-left-color:var(--l);background:var(--l-bg)}
li[data-s="E"]{border-left-color:var(--e);background:var(--e-bg)}
li[data-s="A"]{border-left-color:var(--a);background:var(--a-bg)}
li.tap{cursor:pointer}
li.tap:hover{background:var(--wash)}
li.busy{opacity:.5}
.roll{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:16px;
  font-weight:600;letter-spacing:-.02em;min-width:4.5em}
.name{flex:1;font-size:14.5px;line-height:1.3;min-width:0}
.name em{display:block;font-style:normal;font-size:11.5px;color:var(--muted);
  margin-top:2px;font-variant-numeric:tabular-nums}
.when{flex:1;font-size:14.5px;font-variant-numeric:tabular-nums}
.when em{display:block;font-style:normal;font-size:11.5px;color:var(--muted);margin-top:2px}

/* P / L / A switch */
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-shrink:0}
.seg button{font:inherit;font-size:13px;font-weight:700;width:34px;height:36px;border:0;
  border-left:1px solid var(--line);background:var(--paper);color:var(--muted);cursor:pointer}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"][data-v="P"]{background:var(--p);color:#fff}
.seg button[aria-pressed="true"][data-v="L"]{background:var(--l);color:#fff}
.seg button[aria-pressed="true"][data-v="E"]{background:var(--e);color:#fff}
.seg button[aria-pressed="true"][data-v="A"]{background:var(--a);color:#fff}

/* summary rows */
li.srow[data-low="1"]{border-left-color:var(--a)}
.pct{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:17px;
  font-weight:700;min-width:3.4em;text-align:right}
li.srow[data-low="1"] .pct{color:var(--a)}
.meter{display:block;height:3px;border-radius:2px;background:var(--line);margin-top:5px}
.meter i{display:block;height:100%;border-radius:2px;background:var(--p)}
li.srow[data-low="1"] .meter i{background:var(--a)}
.chev{color:var(--muted);font-size:18px;line-height:1}
.score{width:74px;flex-shrink:0;text-align:right;font-family:var(--mono);
  font-variant-numeric:tabular-nums;font-size:15px;padding:8px 9px}
.score.full{border-color:#b9dfc9;background:var(--p-bg)}
.score.zero{border-color:#eebfc8;background:var(--a-bg);color:var(--a)}
.score.bad{border-color:var(--a);background:var(--a-bg)}
.outof{font-size:13px;color:var(--muted);flex-shrink:0;min-width:2.6em}
.wrow{display:flex;align-items:center;gap:10px;padding:7px 0}
.wrow input[type=text]{flex:1}
.wrow input[type=number]{width:88px;text-align:right}
.wrow button{flex-shrink:0}
.bars{display:flex;gap:2px;margin-top:5px}
.bars i{height:3px;border-radius:2px;background:var(--line)}
.total{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:17px;
  font-weight:700;min-width:3.6em;text-align:right}
.gone{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  color:var(--muted);background:var(--wash);padding:3px 7px;border-radius:5px;margin-left:6px}

/* pills + group headings */
.pill{font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  padding:4px 9px;border-radius:999px;flex-shrink:0;background:var(--wash);color:var(--muted)}
.pill.P{background:var(--p-bg);color:var(--p)}
.pill.L{background:var(--l-bg);color:var(--l)}
.pill.E{background:var(--e-bg);color:var(--e)}
.pill.A{background:var(--a-bg);color:var(--a)}
.grouphead{display:block;padding:9px 12px;background:var(--wash);font-size:11.5px;
  font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  border-top:1px solid var(--line)}

/* student detail banner */
.who{background:var(--ink);color:#fff;border-radius:12px;padding:14px;margin-top:14px;
  display:flex;align-items:center;gap:14px}
.who .roll,.who .name{color:#fff}
.who .name em{color:#9db0cb}
.who .pct{font-size:26px}

/* sticky tally */
footer{position:fixed;left:0;right:0;bottom:0;background:var(--paper);
  border-top:1px solid var(--line);padding:10px 0 max(10px,env(safe-area-inset-bottom))}
footer[hidden]{display:none}
.bar{display:flex;align-items:center;gap:12px}
.tally{flex:1;font-size:13.5px;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.tally b{font-weight:700}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.save{font:inherit;font-size:15px;font-weight:650;padding:12px 22px;border:0;
  border-radius:9px;background:var(--ink);color:#fff;cursor:pointer}
.save:disabled{opacity:.45;cursor:default}

/* messages */
.msg{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:14px;line-height:1.5;
  border:1px solid var(--line);background:var(--paper)}
.msg.good{border-color:#b9dfc9;background:var(--p-bg);color:var(--p)}
.msg.bad{border-color:#eebfc8;background:var(--a-bg);color:var(--a)}
.msg code{font-family:var(--mono);font-size:13px}
.empty{padding:26px 14px;text-align:center;color:var(--muted);font-size:14px;
  display:block;border-left:0}
.headline{margin:14px 0 0;font-size:13.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
[hidden]{display:none !important}
@media (prefers-reduced-motion:no-preference){
  .seg button{transition:background .12s ease,color .12s ease}
  li{transition:opacity .12s ease}
}
</style>

<body class="marking">

<header>
  <div class="wrap">
    <div class="brand"><h1 id="ttl">Attendance</h1><span id="sub"></span></div>
    <div class="tabs" role="tablist">
      <button id="tab-mark"    role="tab" aria-selected="true">Take attendance</button>
      <button id="tab-term"    role="tab" aria-selected="false">Whole term</button>
      <button id="tab-class"   role="tab" aria-selected="false">One class</button>
      <button id="tab-student" role="tab" aria-selected="false">One student</button>
      <button id="tab-marks"   role="tab" aria-selected="false">Marks</button>
      <button id="tab-grades"  role="tab" aria-selected="false">Grades</button>
      <button id="tab-roll"    role="tab" aria-selected="false">Students</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="card">
    <div class="fields one">
      <div>
        <label for="course">Course</label>
        <select id="course"><option>Loading…</option></select>
      </div>
    </div>

    <!-- take attendance -->
    <div id="ctl-mark">
      <div class="fields three" style="margin-top:10px">
        <div>
          <label for="find">Find</label>
          <input type="search" id="find" placeholder="Roll or name" autocomplete="off">
        </div>
        <div>
          <label for="date">Date</label>
          <input type="date" id="date">
        </div>
        <div>
          <label for="cls">Class</label>
          <select id="cls"></select>
        </div>
      </div>
      <div class="tools"><button class="ghost" id="allP">Mark everyone present</button></div>
    </div>

    <!-- whole term -->
    <div id="ctl-term" hidden>
      <div class="tools" style="justify-content:space-between">
        <div style="display:flex;gap:16px;flex-wrap:wrap">
          <label class="check"><input type="checkbox" id="lateOk" checked> Late counts</label>
          <label class="check"><input type="checkbox" id="earlyOk" checked> Early leave counts</label>
        </div>
        <button class="ghost" id="csv">Download CSV</button>
      </div>
    </div>

    <!-- one class -->
    <div id="ctl-class" hidden>
      <div class="fields one" style="margin-top:10px">
        <div>
          <label for="picksession">Class</label>
          <select id="picksession"></select>
        </div>
      </div>
      <div class="tools" style="justify-content:space-between">
        <span style="font-size:13px;color:var(--muted)">Tap P / L / A to correct a mark.</span>
        <button class="ghost danger" id="delsession">Delete this class</button>
      </div>
    </div>

    <!-- one student -->
    <div id="ctl-student" hidden>
      <div class="fields one" style="margin-top:10px">
        <div>
          <label for="sfind">Student</label>
          <input type="search" id="sfind" placeholder="Search a roll or name" autocomplete="off">
        </div>
      </div>
      <div class="tools" id="backrow" hidden>
        <button class="ghost" id="back">← All students</button>
      </div>
    </div>

    <!-- enter marks -->
    <div id="ctl-marks" hidden>
      <div class="fields" style="margin-top:10px;grid-template-columns:1fr 1fr">
        <div>
          <label for="mcomp">Component</label>
          <select id="mcomp"></select>
        </div>
        <div>
          <label for="mitem">Item</label>
          <select id="mitem"></select>
        </div>
      </div>
      <div class="fields three" style="margin-top:10px">
        <div>
          <label for="mlabel">Item name</label>
          <input id="mlabel" placeholder="Homework 1" autocomplete="off">
        </div>
        <div>
          <label for="mdate">Date</label>
          <input type="date" id="mdate">
        </div>
        <div>
          <label for="mmax">Out of</label>
          <input type="number" id="mmax" min="0" step="0.5" value="10">
        </div>
      </div>
      <div class="tools" style="justify-content:space-between">
        <button class="ghost" id="fillabs">Absent that day → A</button>
        <button class="ghost danger" id="delitem" hidden>Delete this item</button>
      </div>
      <p style="margin:8px 0 0;font-size:13px;color:var(--muted);line-height:1.5">
        Type a number, or <b>A</b> for absent — an A is stored as 0. Leave a box
        blank only to excuse someone; blank is left out of their total.</p>
    </div>

    <!-- grades -->
    <div id="ctl-grades" hidden>
      <div class="tools" style="justify-content:space-between">
        <button class="ghost" id="editw">Adjust marks</button>
        <button class="ghost" id="mcsv">Download CSV</button>
      </div>
      <div id="weights" hidden style="margin-top:12px;border-top:1px solid var(--line);padding-top:12px">
        <div id="wlist"></div>
        <div class="tools">
          <button class="ghost" id="addcomp">Add component</button>
          <button class="ghost" id="savew">Save</button>
          <span id="wtotal" style="font-size:13px;color:var(--muted)"></span>
        </div>
      </div>
    </div>

    <!-- students on the roll -->
    <div id="ctl-roll" hidden>
      <div class="fields add" style="margin-top:10px">
        <div>
          <label for="newroll">Roll</label>
          <input id="newroll" placeholder="210103" autocomplete="off">
        </div>
        <div>
          <label for="newname">Name</label>
          <input id="newname" placeholder="Full name" autocomplete="off">
        </div>
        <div><button class="ghost" id="addstu">Add to roll</button></div>
      </div>
    </div>
  </div>

  <div id="note"></div>
  <div id="banner"></div>
  <p class="headline" id="headline"></p>
  <ul id="list"></ul>
</main>

<footer id="foot">
  <div class="wrap bar">
    <div class="tally" id="tally">No students loaded</div>
    <button class="save" id="save" disabled>Save</button>
    <button class="save" id="savem" hidden>Save marks</button>
  </div>
</footer>

<script>
/* If anything below throws, say so on the page. A silent failure used to leave
   the course list stuck on "Loading..." with no clue why. */
window.addEventListener('error', ev => {
  const box = document.getElementById('note');
  const sel = document.getElementById('course');
  if (sel && /Loading/.test(sel.textContent)) sel.innerHTML = '<option>Not loaded</option>';
  if (box && !box.dataset.crashed) {
    box.dataset.crashed = '1';
    box.innerHTML = '<div class="msg bad">This page hit an error and stopped.' +
      '<br><code>' + String(ev.message || ev.error || 'unknown') + '</code>' +
      '<br><br>If you just updated, try a hard refresh (Ctrl+Shift+R).</div>';
  }
});

const $ = id => {
  const el = document.getElementById(id);
  if (!el) throw new Error('This build is missing the "' + id + '" element.');
  return el;
};
const S = { courses: [], students: [], roster: [], marks: {},
            history: null, grades: null, entry: {},
            view: 'mark', picked: null, busy: false };
const FULL = { P: 'Present', L: 'Late', E: 'Early leave', A: 'Absent' };
const CODES = ['P','L','E','A'];
const VIEWS = ['mark','term','class','student','marks','grades','roll'];

$('ttl').textContent = HEADER_TITLE;
$('sub').textContent = HEADER_SUB + '  \u00b7  ';
$('sub').insertAdjacentHTML('beforeend',
  '<a href="#" id="buildinfo" style="color:inherit">build ' + BUILD + '</a>');
$('date').value = new Date().toLocaleDateString('en-CA'); // local YYYY-MM-DD
$('cls').innerHTML = Array.from({ length: CLASSES_PER_DAY },
  (_, i) => `<option value="${i+1}">Class ${i+1}</option>`).join('');

const note = (t,k) => $('note').innerHTML = t ? `<div class="msg ${k||''}">${t}</div>` : '';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const remember = (k,v) => { try{ localStorage.setItem(k,v); }catch(e){} };
const recall   = k => { try{ return localStorage.getItem(k); }catch(e){ return null; } };
const forget   = k => { try{ localStorage.removeItem(k); }catch(e){} };
const byRoll   = (a,b) => a.roll.localeCompare(b.roll, undefined, { numeric:true });
const course   = () => S.courses[$('course').value];
const nameFor  = roll => {
  const s = S.roster.find(x => x.roll === roll);
  return (s && s.name) || (S.history && S.history.names[roll]) || '';
};

/* ---------- the PIN gates reading as well as writing ------------------ */
/**
 * A blank saved PIN counts as no PIN. Earlier versions let you press OK on an
 * empty prompt and stored "", which then looked like a saved answer forever.
 */
function pin(retry) {
  let v = recall('pin');
  if (retry || !v) {
    v = (prompt(retry ? 'That PIN was not accepted. Try again:'
                      : 'PIN for this attendance sheet:') || '').trim();
    remember('pin', v);
  }
  return v;
}

/** Run a call, and if the PIN was wrong, ask once more before giving up. */
async function tryTwice(run) {
  let data = await run(pin());
  if (!data.ok && data.code === 'PIN') {
    const again = pin(true);
    if (!again) { forget('pin'); return data; }
    data = await run(again);
    if (!data.ok && data.code === 'PIN') forget('pin');
  }
  return data;
}

/* ---------- one door in, one door out --------------------------------- */
const get = params => tryTwice(p => {
  const q = new URLSearchParams(Object.assign({ pin: p }, params)).toString();
  return timed(fetch(API + '?' + q).then(r => r.json()), 25);
});

/** Reject rather than hang: a stalled request used to sit on "Loading..." forever. */
function timed(promise, seconds) {
  return Promise.race([
    promise,
    new Promise((_, no) => setTimeout(
      () => no(new Error('No answer from the script after ' + seconds + ' seconds.')),
      seconds * 1000))
  ]);
}

const post = (action, extra) => tryTwice(p => fetch(API, {
  // text/plain keeps this a simple request, so the browser skips preflight
  method: 'POST',
  headers: { 'Content-Type': 'text/plain;charset=utf-8' },
  body: JSON.stringify(Object.assign({ action, pin: p }, extra))
}).then(r => r.json()));

/** Course identity, sent with every attendance write. */
const where = () => {
  const c = course();
  return { courseCode: c.code, courseTitle: c.title, section: c.section };
};

/** Shown when the script turns us away. Never leaves you with no way back in. */
function pinWall(reason) {
  $('course').innerHTML = '<option>Locked</option>';
  note(esc(reason || 'The script would not accept that PIN.') +
       '<br><br><button class="ghost" id="repin">Enter the PIN</button>', 'bad');
}

$('note').addEventListener('click', e => {
  if (e.target.closest('#repin')) { forget('pin'); note(''); load(); }
});

/* Tap the build stamp when something looks wrong: it reports what this copy is
   and clears the saved PIN, which covers the two commonest causes. */
$('buildinfo').addEventListener('click', ev => {
  ev.preventDefault();
  if (!confirm('Build ' + BUILD + '\n\nClear the saved PIN and reload?')) return;
  forget('pin'); forget('course');
  location.replace(location.pathname + '?v=' + Date.now());
});

/* ---------- load courses + students ---------------------------------- */
async function load(keepMarks) {
  if (API.indexOf('PASTE_') === 0) {
    note('Open <code>index.html</code> and paste your Apps Script web app URL into the <code>API</code> line near the top.', 'bad');
    $('course').innerHTML = '<option>Not connected</option>';
    return;
  }
  try {
    const data = await get({});
    if (!data.ok && data.code === 'PIN') return pinWall(data.error);
    if (!data.ok) throw new Error(data.error);
    S.courses = data.courses;
    S.students = data.students;

    if (!S.courses.length) note('No courses yet. Add a row to the <b>Courses</b> sheet, then reload.', 'bad');
    const chosen = $('course').value;
    $('course').innerHTML = S.courses
      .map((c,i) => `<option value="${i}">${esc(c.code)} — ${esc(c.title)} · ${esc(c.section)}</option>`)
      .join('') || '<option>No courses</option>';

    const last = keepMarks ? chosen : recall('course');
    if (last !== null && S.courses[last]) $('course').value = last;
    keepMarks ? rebuildRoster() : pickCourse();
  } catch (err) {
    $('course').innerHTML = '<option>Not loaded</option>';
    note('Could not reach the script.<br><code>' + esc(err.message) + '</code>' +
         '<br><br>Things to check, in order:' +
         '<br>1. The deployment\u2019s access is set to <b>Anyone</b>.' +
         '<br>2. You published a <b>new version</b> after your last code edit.' +
         '<br>3. The link below returns text rather than an error page.' +
         '<br><br><a href="' + esc(API) + '" target="_blank" rel="noopener">Open the script URL directly</a>', 'bad');
  }
}

function pickCourse() {
  const c = course();
  if (!c) return;
  remember('course', $('course').value);
  S.history = null;
  S.grades = null;
  S.picked = null;
  S.entry = {};
  rebuildRoster();
}

/** Refresh the roster, keeping any marks already made for students who remain. */
function rebuildRoster() {
  const c = course();
  if (!c) return;
  S.roster = S.students.filter(s => s.section === c.section).sort(byRoll);
  const kept = {};
  S.roster.forEach(s => kept[s.roll] = S.marks[s.roll] || 'P');
  S.marks = kept;
  render();
}

/* ---------- view switching ------------------------------------------- */
function show(view) {
  S.view = view;
  VIEWS.forEach(v => {
    $('tab-'+v).setAttribute('aria-selected', v === view);
    $('ctl-'+v).hidden = v !== view;
  });
  const footed = view === 'mark' || view === 'marks';
  $('foot').hidden = !footed;
  $('save').hidden = view !== 'mark';
  $('savem').hidden = view !== 'marks';
  document.body.classList.toggle('marking', footed);
  note('');
  render();
}
VIEWS.forEach(v => $('tab-'+v).addEventListener('click', () => show(v)));

function render() {
  $('banner').innerHTML = '';
  if (S.view === 'mark') return drawRoster();
  if (S.view === 'roll') return drawRoll();

  if (S.view === 'marks' || S.view === 'grades') {
    if (!S.grades) return loadGrades();
    return S.view === 'marks' ? drawEntry() : drawGrades();
  }
  if (!S.history) return loadHistory();
  if (S.view === 'term') return drawTerm();
  if (S.view === 'class') return drawSession();
  return drawStudent();
}

/* ---------- 1. take attendance ---------------------------------------- */
function drawRoster() {
  $('headline').textContent = '';
  if (!S.roster.length) {
    $('list').innerHTML = '<li class="empty">Nobody on this roll yet. Add students on the Students tab.</li>';
    $('save').disabled = true; tally(); return;
  }
  $('list').innerHTML = S.roster.map(s => `
    <li data-s="${S.marks[s.roll]}" data-key="${esc((s.roll+' '+s.name).toLowerCase())}">
      <span class="roll">${esc(s.roll)}</span>
      <span class="name">${esc(s.name)}</span>
      ${seg(s.roll, S.marks[s.roll])}</li>`).join('');
  $('save').disabled = false;
  filter(); tally();
}

/** The P / L / A control. Pass a session key to make it edit the sheet directly. */
function seg(roll, current, key) {
  return '<span class="seg">' + CODES.map(v =>
    `<button data-v="${v}" data-roll="${esc(roll)}"${key ? ` data-key="${esc(key)}"` : ''}` +
    ` aria-pressed="${current===v}" aria-label="${FULL[v]} ${esc(roll)}">${v}</button>`).join('') + '</span>';
}

function tally() {
  const n = { P:0, L:0, E:0, A:0 };
  S.roster.forEach(s => n[S.marks[s.roll]]++);
  const chip = (c,v,word) => `<span class="dot" style="background:var(--${c})"></span><b>${v}</b> ${word}`;
  $('tally').innerHTML = S.roster.length
    ? [chip('p',n.P,'present'), chip('l',n.L,'late'),
       chip('e',n.E,'early'), chip('a',n.A,'absent')].join(' &nbsp; ')
    : 'No students loaded';
}

function filter() {
  const q = $('find').value.trim().toLowerCase();
  document.querySelectorAll('#list li[data-key]').forEach(li =>
    li.classList.toggle('hide', !!q && li.dataset.key.indexOf(q) === -1));
}

$('course').addEventListener('change', pickCourse);
$('find').addEventListener('input', filter);
$('allP').addEventListener('click', () => { S.roster.forEach(s => S.marks[s.roll]='P'); drawRoster(); });

/* ---------- history --------------------------------------------------- */
async function loadHistory(quiet) {
  const c = course();
  if (!c) return;
  if (!quiet) {
    $('list').innerHTML = '<li class="empty">Reading the sheet…</li>';
    $('headline').textContent = '';
  }
  try {
    const data = await get({ action: 'history', course: c.code, section: c.section });
    if (!data.ok && data.code === 'PIN') { if (!quiet) $('list').innerHTML = ''; return pinWall(data.error); }
    if (!data.ok) throw new Error(data.error);
    S.history = data;
    const chosen = $('picksession').value;
    $('picksession').innerHTML = data.sessions.slice().reverse()
      .map(s => `<option value="${s.key}">${esc(sessionLabel(s))}</option>`).join('');
    if (data.sessions.some(s => s.key === chosen)) $('picksession').value = chosen;
    if (!quiet) render();
  } catch (err) {
    S.history = null;
    if (!quiet) $('list').innerHTML = '';
    note('Could not read past records.<br><code>' + esc(err.message) + '</code>', 'bad');
  }
}

function prettyDate(d) {
  const [y,m,day] = d.split('-');
  return new Date(y, m-1, day).toLocaleDateString(undefined,
    { weekday:'short', day:'numeric', month:'short', year:'numeric' });
}

/** Show the class number only on days that actually had more than one class. */
function sessionLabel(s) {
  const same = S.history.sessions.filter(x => x.date === s.date).length;
  return prettyDate(s.date) + (same > 1 ? ' · Class ' + s.cls : '');
}

function summarise() {
  const h = S.history, lateOk = $('lateOk').checked, earlyOk = $('earlyOk').checked;
  const rolls = Object.keys(h.marks);
  S.roster.forEach(s => { if (rolls.indexOf(s.roll) === -1) rolls.push(s.roll); });

  return rolls.map(roll => {
    const rec = h.marks[roll] || {};
    const n = { P:0, L:0, E:0, A:0 };
    h.sessions.forEach(s => { if (rec[s.key]) n[rec[s.key]]++; });
    const held = n.P + n.L + n.E + n.A;
    const credit = n.P + (lateOk ? n.L : 0) + (earlyOk ? n.E : 0);
    const known = S.roster.find(s => s.roll === roll);
    return { roll, name: (known && known.name) || h.names[roll] || '', onRoll: !!known,
             ...n, held, pct: held ? Math.round(credit / held * 100) : 0 };
  }).sort(byRoll);
}

/* ---------- 2. whole term --------------------------------------------- */
function drawTerm() {
  const h = S.history;
  if (!h.sessions.length) {
    $('headline').textContent = '';
    $('list').innerHTML = '<li class="empty">Nothing recorded for this course yet.</li>';
    return;
  }
  const rows = summarise();
  const below = rows.filter(r => r.held && r.pct < PASS_MARK).length;
  $('headline').innerHTML = `<b>${h.sessions.length}</b> classes held · <b>${rows.length}</b> students · ` +
    (below ? `<b style="color:var(--a)">${below}</b> below ${PASS_MARK}%` : `everyone at or above ${PASS_MARK}%`);
  $('list').innerHTML = rows.map(summaryRow).join('');
}

function summaryRow(r) {
  return `<li class="srow tap" data-roll="${esc(r.roll)}" data-low="${r.held && r.pct < PASS_MARK ? 1 : 0}">
      <span class="roll">${esc(r.roll)}</span>
      <span class="name">${esc(r.name)}${r.onRoll ? '' : '<span class="gone">off roll</span>'}
        <em>${r.held ? `${r.P} present · ${r.L} late · ${r.E} early · ${r.A} absent · of ${r.held}`
                     : 'never marked in this course'}</em>
        <span class="meter"><i style="width:${r.held ? r.pct : 0}%"></i></span>
      </span>
      <span class="pct">${r.held ? r.pct + '%' : '—'}</span>
      <span class="chev">›</span>
    </li>`;
}

['lateOk','earlyOk'].forEach(id => $(id).addEventListener('change', () => {
  if (S.view === 'term') drawTerm();
  else if (S.view === 'student') drawStudent();
  else if (S.view === 'grades') drawGrades();
}));

$('csv').addEventListener('click', () => {
  if (!S.history || !S.history.sessions.length) return;
  const c = course(), h = S.history, rows = summarise();

  const head = ['Roll','Name']
    .concat(h.sessions.map(s => s.date + ' C' + s.cls))
    .concat(['Present','Late','Absent','Classes','Percentage']);

  const body = rows.map(r => {
    const rec = h.marks[r.roll] || {};
    return [r.roll, r.name]
      .concat(h.sessions.map(s => rec[s.key] || ''))
      .concat([r.P, r.L, r.A, r.held, r.held ? r.pct + '%' : '']);
  });

  const csv = [head].concat(body)
    .map(l => l.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff' + csv], { type:'text/csv' }));
  a.download = `${c.code.replace(/\s+/g,'')}-${c.section}-attendance.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
});

/* ---------- 3. one class ---------------------------------------------- */
function drawSession() {
  const h = S.history, key = $('picksession').value;
  $('delsession').disabled = !key;
  if (!h.sessions.length || !key) {
    $('headline').textContent = '';
    $('list').innerHTML = '<li class="empty">Nothing recorded for this course yet.</li>';
    return;
  }
  const groups = { A:[], E:[], L:[], P:[] };
  Object.keys(h.marks).forEach(roll => {
    const st = h.marks[roll][key];
    if (st && groups[st]) groups[st].push({ roll, name: h.names[roll] || '' });
  });

  sessionCounts(key);

  const block = (k, title) => !groups[k].length ? '' :
    `<li class="grouphead">${title} — ${groups[k].length}</li>` +
    groups[k].sort(byRoll).map(x => `
      <li data-s="${k}">
        <span class="roll">${esc(x.roll)}</span>
        <span class="name">${esc(x.name)}</span>
        ${seg(x.roll, k, key)}
      </li>`).join('');

  $('list').innerHTML = block('A','Absent') + block('E','Left early') +
                        block('L','Late') + block('P','Present');
}

/** Recount the headline from current marks — cheap enough to redo on every edit. */
function sessionCounts(key) {
  const h = S.history, n = { P:0, L:0, E:0, A:0 };
  Object.keys(h.marks).forEach(roll => {
    const st = h.marks[roll][key]; if (st && n[st] !== undefined) n[st]++;
  });
  const s = h.sessions.find(x => x.key === key);
  const total = n.P + n.L + n.E + n.A;
  $('headline').innerHTML = `${esc(sessionLabel(s))} · <b>${n.P}</b> present, ` +
    `<b>${n.L}</b> late, <b>${n.E}</b> left early, ` +
    `<b style="color:var(--a)">${n.A}</b> absent of ${total}`;
}

$('picksession').addEventListener('change', drawSession);

$('delsession').addEventListener('click', async () => {
  const key = $('picksession').value;
  const s = S.history && S.history.sessions.find(x => x.key === key);
  if (!s) return;
  if (!confirm(`Delete every mark for ${sessionLabel(s)}?\n\nThis removes the class from the sheet. It cannot be undone.`)) return;

  $('delsession').disabled = true;
  const data = await post('deleteSession', Object.assign(where(), { date: s.date, cls: s.cls }));
  if (data.ok) {
    S.history = null;
    note(`Deleted ${data.deleted} marks. That class is gone from the sheet.`, 'good');
    loadHistory();
  } else {
    $('delsession').disabled = false;
    note(esc(data.error || 'Could not delete that class.'), 'bad');
  }
});

/* ---------- 4. one student -------------------------------------------- */
function drawStudent() {
  const h = S.history;
  $('backrow').hidden = !S.picked;

  if (!h.sessions.length) {
    $('headline').textContent = '';
    $('list').innerHTML = '<li class="empty">Nothing recorded for this course yet.</li>';
    return;
  }
  if (!S.picked) return drawStudentList();

  const r = summarise().find(x => x.roll === S.picked);
  if (!r) { S.picked = null; return drawStudentList(); }

  $('banner').innerHTML = `<div class="who">
      <span class="roll">${esc(r.roll)}</span>
      <span class="name">${esc(r.name)}<em>${r.P} present · ${r.L} late · ${r.E} early · ${r.A} absent · of ${r.held} classes</em></span>
      <span class="pct" style="color:${r.held && r.pct < PASS_MARK ? '#ff9db0' : '#8fe3b6'}">${r.held ? r.pct+'%' : '—'}</span>
    </div>`;
  $('headline').innerHTML = r.held && r.pct < PASS_MARK
    ? `<b style="color:var(--a)">Below the ${PASS_MARK}% mark.</b> Tap P / L / A to correct any class.`
    : 'Every class recorded for this course. Tap P / L / A to correct one.';

  const rec = h.marks[r.roll] || {};
  $('list').innerHTML = h.sessions.slice().reverse().map(s => `
    <li data-s="${rec[s.key] || ''}">
      <span class="when">${esc(prettyDate(s.date))}<em>Class ${esc(s.cls)}</em></span>
      ${seg(r.roll, rec[s.key] || '', s.key)}
    </li>`).join('');
}

function drawStudentList() {
  $('banner').innerHTML = '';
  const q = $('sfind').value.trim().toLowerCase();
  const rows = summarise().filter(r =>
    !q || (r.roll + ' ' + r.name).toLowerCase().indexOf(q) !== -1);

  $('headline').innerHTML = q
    ? `<b>${rows.length}</b> ${rows.length === 1 ? 'match' : 'matches'} — tap to see the full term`
    : 'Search above, or tap any student to see their full term';
  $('list').innerHTML = rows.length
    ? rows.map(summaryRow).join('')
    : '<li class="empty">Nobody matches that roll or name.</li>';
}

$('sfind').addEventListener('input', () => {
  S.picked = null;
  if (S.view === 'student' && S.history) drawStudent();
});
$('back').addEventListener('click', () => { S.picked = null; drawStudent(); });

/* ---------- 5. students on the roll ----------------------------------- */
function drawRoll() {
  const c = course();
  $('banner').innerHTML = '';
  $('headline').innerHTML = c
    ? `<b>${S.roster.length}</b> students on the ${esc(c.section)} roll`
    : '';
  $('list').innerHTML = S.roster.length
    ? S.roster.map(s => `
      <li>
        <span class="roll">${esc(s.roll)}</span>
        <span class="name">${esc(s.name)}</span>
        <button class="ghost danger" data-drop="${esc(s.roll)}">Remove</button>
      </li>`).join('')
    : '<li class="empty">Nobody on this roll yet. Add the first student above.</li>';
}

$('addstu').addEventListener('click', async () => {
  const c = course();
  const roll = $('newroll').value.trim(), name = $('newname').value.trim();
  if (!c) return;
  if (!roll) { note('A roll number is needed.', 'bad'); return; }

  $('addstu').disabled = true;
  const data = await post('addStudent', { roll, name, section: c.section });
  $('addstu').disabled = false;

  if (data.ok) {
    $('newroll').value = ''; $('newname').value = '';
    note(`${esc(roll)} added to the ${esc(c.section)} roll.`, 'good');
    load(true);
  } else {
    note(esc(data.error || 'Could not add that student.'), 'bad');
  }
});

async function dropStudent(roll) {
  const c = course();
  const who = `${roll}${nameFor(roll) ? ' (' + nameFor(roll) + ')' : ''}`;
  if (!confirm(`Remove ${who} from the ${c.section} roll?\n\nThey will not appear when you take attendance.`)) return;

  const purge = confirm(
    `Also delete every attendance record for ${roll} in ${c.section}?\n\n` +
    `OK — erase their history too.\n` +
    `Cancel — keep the history, just take them off the roll.`);

  const data = await post('removeStudent', { roll, section: c.section, purge });
  if (data.ok) {
    S.history = null;
    note(`${esc(roll)} removed from the roll` +
         (data.purged ? ` and ${data.purged} attendance records deleted.` : ', history kept.'), 'good');
    load(true);
  } else {
    note(esc(data.error || 'Could not remove that student.'), 'bad');
  }
}

/* ---------- one click handler for the shared list ---------------------- */
$('list').addEventListener('click', e => {
  if (e.target.closest('#mkdefault')) return makeDefaults();

  const drop = e.target.closest('button[data-drop]');
  if (drop) return dropStudent(drop.dataset.drop);

  const b = e.target.closest('button[data-v]');
  if (b) {
    if (b.dataset.key) return editMark(b);      // report views write to the sheet
    S.marks[b.dataset.roll] = b.dataset.v;      // taking attendance is local until Save
    paint(b.closest('li'), b.dataset.v);
    return tally();
  }
  const row = e.target.closest('li.tap');
  if (row) {
    S.picked = row.dataset.roll;
    if (S.view !== 'student') show('student'); else drawStudent();
  }
});

/** Update a row in place — no re-sort, so the row you tapped stays put. */
function paint(li, v) {
  li.dataset.s = v;
  li.querySelectorAll('button[data-v]').forEach(x =>
    x.setAttribute('aria-pressed', x.dataset.v === v));
}

/* ---------- edit one mark straight into the sheet ---------------------- */
async function editMark(btn) {
  const roll = btn.dataset.roll, key = btn.dataset.key, v = btn.dataset.v;
  const h = S.history, s = h.sessions.find(x => x.key === key);
  if (!s) return;

  const li = btn.closest('li');
  const before = (h.marks[roll] || {})[key];
  if (before === v) return;

  if (!h.marks[roll]) h.marks[roll] = {};
  h.marks[roll][key] = v;
  paint(li, v);
  li.classList.add('busy');
  if (S.view === 'class') sessionCounts(key);
  note('');

  const data = await post('setMark', Object.assign(where(), {
    date: s.date, cls: s.cls, roll, name: nameFor(roll), status: FULL[v]
  }));
  li.classList.remove('busy');

  if (data.ok) {
    if (S.view === 'student') drawStudent();   // refresh the banner percentage
  } else {
    if (before) h.marks[roll][key] = before; else delete h.marks[roll][key];
    paint(li, before || '');
    if (S.view === 'class') sessionCounts(key);
    note(esc(data.error || 'That change did not reach the sheet.'), 'bad');
  }
}


/* ====================================================================== *
 *  Internal marks
 * ====================================================================== */

const NEW_ITEM = '\u0000new';

async function loadGrades() {
  const c = course();
  if (!c) return;
  $('list').innerHTML = '<li class="empty">Reading the sheet\u2026</li>';
  $('headline').textContent = '';
  try {
    const data = await get({ action: 'marks', course: c.code, section: c.section });
    if (!data.ok && data.code === 'PIN') { $('list').innerHTML = ''; return pinWall(data.error); }
    if (!data.ok) throw new Error(data.error);
    S.grades = data;
    fillComponents();
    render();
  } catch (err) {
    S.grades = null;
    $('list').innerHTML = '';
    note('Could not read the marks.<br><code>' + esc(err.message) + '</code>', 'bad');
  }
}

function fillComponents() {
  const g = S.grades;
  const keep = $('mcomp').value;
  $('mcomp').innerHTML = g.components.map(c =>
    `<option value="${esc(c.name)}">${esc(c.name)}</option>`).join('');
  if (g.components.some(c => c.name === keep)) $('mcomp').value = keep;
  fillItems();
}

function fillItems() {
  const g = S.grades, comp = $('mcomp').value;
  const mine = g.items.filter(i => i.component === comp);
  const keep = $('mitem').value;
  $('mitem').innerHTML = mine.map(i =>
      `<option value="${esc(i.key)}">${esc(i.item)} \u00b7 out of ${i.max}</option>`).join('') +
    `<option value="${NEW_ITEM}">+ New item\u2026</option>`;
  $('mitem').value = mine.some(i => i.key === keep) ? keep : (mine.length ? mine[0].key : NEW_ITEM);
  loadEntry();
}

/** Pull the chosen item into the entry form, or clear it for a new one. */
function loadEntry() {
  const g = S.grades, key = $('mitem').value, comp = $('mcomp').value;
  const item = g.items.find(i => i.key === key);

  if (item) {
    S.entry = { key, isNew: false };
    $('mlabel').value = item.item;
    $('mmax').value = item.max;
    $('mdate').value = item.date;
    $('delitem').hidden = false;
  } else {
    S.entry = { key: null, isNew: true };
    $('mlabel').value = nextLabel(comp);
    $('mdate').value = new Date().toLocaleDateString('en-CA');
    $('delitem').hidden = true;
  }
  if (S.view === 'marks') drawEntry();
}

/** "Homework 3" when Homework 1 and 2 already exist. */
function nextLabel(comp) {
  const n = S.grades.items.filter(i => i.component === comp).length;
  return comp + ' ' + (n + 1);
}

function drawEntry() {
  const g = S.grades;
  if (!g.components.length) return offerDefaults();
  if (!S.roster.length) {
    $('headline').textContent = '';
    $('list').innerHTML = '<li class="empty">Nobody on this roll yet. Add students on the Students tab.</li>';
    return;
  }
  const key = S.entry.key, max = Number($('mmax').value) || 0;
  $('headline').innerHTML = S.entry.isNew
    ? 'New item \u2014 name it above, then enter the scores.'
    : `Editing <b>${esc($('mlabel').value)}</b>. Saving replaces every score for this item.`;

  $('list').innerHTML = S.roster.map(s => {
    const v = key && g.scores[s.roll] ? g.scores[s.roll][key] : undefined;
    return `<li>
      <span class="roll">${esc(s.roll)}</span>
      <span class="name">${esc(s.name)}</span>
      <input class="score" type="text" inputmode="decimal" autocomplete="off"
             data-roll="${esc(s.roll)}" value="${v === undefined ? '' : v}"
             aria-label="Score for ${esc(s.roll)}, or A for absent">
      <span class="outof">/ ${max}</span>
    </li>`;
  }).join('');
}

function offerDefaults() {
  const c = course();
  $('headline').textContent = '';
  $('list').innerHTML = `<li class="empty">
      No mark components set up for ${esc(c.code)} yet.<br><br>
      <button class="ghost" id="mkdefault">Set up ${esc(c.type)} components</button>
    </li>`;
}

/* Marks allotted, not percentages. The usual 60 + 40 and 30 + 70 splits. */
const DEFAULTS = {
  Sessional: [['Homework',10],['Lab task',20],['Lab report',20],['Class performance',10]],
  Theory: [['Homework',5],['Assignment',5],['Spot test',5],['Class test',10],['Class performance',5]]
};

async function makeDefaults() {
  const c = course();
  const list = (DEFAULTS[c.type] || DEFAULTS.Theory).map(x => ({ name: x[0], marks: x[1] }));
  const data = await post('saveComponents', Object.assign(where(), { components: list }));
  if (data.ok) { S.grades = null; note(''); loadGrades(); }
  else note(esc(data.error || 'Could not save those components.'), 'bad');
}

['mcomp','mitem','mmax','mlabel'].forEach(id => $(id).addEventListener('change', () => {
  if (id === 'mcomp') return fillItems();
  if (id === 'mitem') return loadEntry();
  if (S.view === 'marks') drawEntry();
}));

/** '' excuses, A means absent and scores 0, anything else must be a number. */
function readScore(raw) {
  const v = String(raw).trim();
  if (v === '') return { skip: true };
  if (/^a$/i.test(v)) return { score: 0 };
  const n = Number(v);
  return isNaN(n) ? { bad: true } : { score: n };
}

/* ---- fill 0 for whoever was absent that day ------------------------- */
$('fillabs').addEventListener('click', async () => {
  const date = $('mdate').value;
  if (!date) { note('Set the item date first.', 'bad'); return; }

  $('fillabs').disabled = true;
  if (!S.history) await loadHistory(true);
  $('fillabs').disabled = false;
  if (!S.history) return;

  const keys = S.history.sessions.filter(s => s.date === date).map(s => s.key);
  if (!keys.length) {
    note('No attendance was recorded for ' + esc(prettyDate(date)) + '.', 'bad');
    return;
  }

  let hit = 0;
  document.querySelectorAll('#list input.score').forEach(el => {
    const rec = S.history.marks[el.dataset.roll] || {};
    if (keys.some(k => rec[k] === 'A')) { el.value = 'A'; hit++; }
  });
  paintScores();
  note(hit ? `Marked ${hit} absentee${hit === 1 ? '' : 's'} as A. Save to store it.`
           : 'Nobody was absent that day.', hit ? 'good' : '');
});

/* ---- save one item ------------------------------------------------- */
$('savem').addEventListener('click', () => saveMarks(false));

async function saveMarks(overwrite) {
  if (S.busy) return;
  const label = $('mlabel').value.trim();
  if (!label) { note('Give the item a name first.', 'bad'); return; }

  S.busy = true; $('savem').disabled = true; $('savem').textContent = 'Saving\u2026'; note('');

  const boxes = Array.from(document.querySelectorAll('#list input.score'));
  const bad = boxes.filter(el => readScore(el.value).bad);
  if (bad.length) {
    S.busy = false; resetM();
    note(`${bad.length} box${bad.length === 1 ? '' : 'es'} hold something that is neither a number nor A.`, 'bad');
    bad[0].focus();
    return;
  }
  const records = boxes.map(el => {
    const p = readScore(el.value);
    return { roll: el.dataset.roll, name: nameFor(el.dataset.roll),
             score: p.skip ? '' : p.score };
  });

  try {
    const data = await post('saveItem', Object.assign(where(), {
      overwrite, isNew: S.entry.isNew, component: $('mcomp').value, item: label,
      max: Number($('mmax').value) || 0, date: $('mdate').value, records
    }));

    if (data.code === 'ALREADY_SAVED') {
      if (confirm(`An item called "${label}" already exists in ${$('mcomp').value}. Replace it?`)) {
        S.busy = false; resetM(); return saveMarks(true);
      }
      note('Kept the earlier item. Nothing was changed.');
    } else if (data.ok) {
      note(`Saved ${data.saved} scores for ${esc(label)}.`, 'good');
      S.grades = null;
      S.busy = false; resetM();
      await loadGrades();
      $('mitem').value = $('mcomp').value + '#' + label;
      loadEntry();
      return;
    } else {
      note(esc(data.error || 'The sheet rejected those marks.'), 'bad');
    }
  } catch (err) {
    note('Save failed \u2014 your scores are still on screen, so try again once you have a connection.<br><code>' + esc(err.message) + '</code>', 'bad');
  } finally {
    S.busy = false; resetM();
  }
}

function resetM() { $('savem').disabled = false; $('savem').textContent = 'Save marks'; }

/** Green for full marks, red for a zero or an A, so the column reads at a glance. */
function paintScores() {
  const max = Number($('mmax').value) || 0;
  document.querySelectorAll('#list input.score').forEach(el => {
    const p = readScore(el.value);
    el.classList.toggle('full', !p.skip && !p.bad && max > 0 && p.score >= max);
    el.classList.toggle('zero', !p.skip && !p.bad && p.score === 0);
    el.classList.toggle('bad', !!p.bad);
  });
}
$('list').addEventListener('input', e => { if (e.target.classList.contains('score')) paintScores(); });

$('delitem').addEventListener('click', async () => {
  const item = S.grades && S.grades.items.find(i => i.key === S.entry.key);
  if (!item) return;
  if (!confirm(`Delete every score for ${item.item}?\n\nThis cannot be undone.`)) return;

  const data = await post('deleteItem', Object.assign(where(), {
    component: item.component, item: item.item
  }));
  if (data.ok) { S.grades = null; note(`Deleted ${data.deleted} scores.`, 'good'); loadGrades(); }
  else note(esc(data.error || 'Could not delete that item.'), 'bad');
});

/* ---- weighted totals ------------------------------------------------ */

/**
 * Raw marks, not percentages.
 *
 * Each component is worth the marks allotted to it. A student's score for a
 * component is their share of the items recorded so far, scaled to that
 * allotment: three homeworks out of 10 each, scoring 24, is 24/30 of the 5
 * marks Homework is worth.
 *
 *   per        marks earned per component (null when nothing recorded)
 *   earned     those added up
 *   assessed   marks allotted to the components that have any item recorded
 *   possible   marks allotted across every component
 */
function grade(roll) {
  const g = S.grades, per = {};
  let earned = 0, assessed = 0, possible = 0;

  g.components.forEach(c => {
    const allot = Number(c.marks) || 0;
    possible += allot;

    let got = 0, out = 0;
    g.items.filter(i => i.component === c.name).forEach(i => {
      const v = (g.scores[roll] || {})[i.key];
      if (v !== undefined) { got += v; out += i.max; }
    });

    if (out) {
      per[c.name] = got / out * allot;
      earned += per[c.name];
      assessed += allot;
    } else {
      per[c.name] = null;
    }
  });

  return { per, earned, assessed, possible,
           pct: assessed ? earned / assessed * 100 : null };
}

/** Letter and grade point for a percentage. */
function letter(pct) {
  if (pct === null) return { grade: '—', point: null };
  const row = GRADE_SCALE.find(r => pct >= r[0]) || GRADE_SCALE[GRADE_SCALE.length - 1];
  return { grade: row[1], point: row[2] };
}

function drawGrades() {
  const g = S.grades;
  if (!g.components.length) return offerDefaults();

  const possible = g.components.reduce((a, c) => a + (Number(c.marks) || 0), 0);
  const rolls = S.roster.map(s => s.roll);
  Object.keys(g.scores).forEach(r => { if (rolls.indexOf(r) === -1) rolls.push(r); });

  const sample = rolls.length ? grade(rolls[0]) : null;
  const assessed = sample ? sample.assessed : 0;

  $('headline').innerHTML =
    `<b>${g.components.length}</b> components worth <b>${round(possible)}</b> marks \u00b7 ` +
    `<b>${g.items.length}</b> items` +
    (assessed < possible
      ? ` \u00b7 <b>${round(assessed)}</b> assessed so far, so totals are out of ${round(assessed)}`
      : '');

  $('list').innerHTML = rolls.sort((a,b) => a.localeCompare(b, undefined, {numeric:true}))
    .map(roll => {
      const r = grade(roll);
      const lg = letter(r.pct);
      const bars = g.components.map(c => {
        const v = r.per[c.name], allot = Number(c.marks) || 0;
        const share = allot ? (v === null ? 0 : v / allot * 100) : 0;
        const col = v === null ? 'var(--line)' : (share < 40 ? 'var(--a)' : 'var(--p)');
        return `<i style="flex:${allot || 1};background:${col}" title="${esc(c.name)}"></i>`;
      }).join('');
      const detail = g.components.map(c =>
        `${esc(c.name)} ${r.per[c.name] === null ? '\u2014' : round(r.per[c.name])}/${round(Number(c.marks)||0)}`
      ).join(' \u00b7 ');
      return `<li data-low="${r.pct !== null && r.pct < 40 ? 1 : 0}" class="srow">
        <span class="roll">${esc(roll)}</span>
        <span class="name">${esc(nameFor(roll))}<em>${detail}</em>
          <span class="bars">${bars}</span></span>
        <span class="total">${round(r.earned)}<em style="display:block;font-style:normal;font-size:11px;color:var(--muted);font-weight:600">of ${round(r.assessed)}</em></span>
        <span class="pct" style="min-width:2.6em">${lg.grade}</span>
      </li>`;
    }).join('');
}

const round = n => Math.round(n * 10) / 10;

/* ---- weight editor --------------------------------------------------- */
$('editw').addEventListener('click', () => {
  const open = $('weights').hidden;
  $('weights').hidden = !open;
  $('editw').textContent = open ? 'Hide' : 'Adjust marks';
  if (open) drawWeights();
});

function drawWeights(list) {
  const items = list || (S.grades ? S.grades.components.map(c => ({ ...c })) : []);
  $('wlist').innerHTML = items.map((c, i) => `
    <div class="wrow">
      <input type="text" data-w="name" data-i="${i}" value="${esc(c.name)}" aria-label="Component name">
      <input type="number" data-w="marks" data-i="${i}" value="${c.marks}" min="0" step="1" aria-label="Marks allotted">
      <button class="ghost danger" data-wdel="${i}">\u00d7</button>
    </div>`).join('') || '<p style="font-size:13.5px;color:var(--muted);margin:0">No components yet.</p>';
  weightTotal();
}

function readWeights() {
  const out = [];
  $('wlist').querySelectorAll('[data-w="name"]').forEach(el => {
    const i = el.dataset.i;
    const w = $('wlist').querySelector(`[data-w="marks"][data-i="${i}"]`);
    out.push({ name: el.value.trim(), marks: Number(w.value) || 0 });
  });
  return out.filter(c => c.name);
}

function weightTotal() {
  const t = readWeights().reduce((a, c) => a + c.marks, 0);
  $('wtotal').innerHTML = `Course total <b>${round(t)}</b> marks`;
}

$('wlist').addEventListener('input', weightTotal);
$('wlist').addEventListener('click', e => {
  const d = e.target.closest('[data-wdel]');
  if (!d) return;
  const list = readWeights();
  list.splice(Number(d.dataset.wdel), 1);
  drawWeights(list);
});

$('addcomp').addEventListener('click', () => drawWeights(readWeights().concat([{ name: '', weight: 0 }])));

$('savew').addEventListener('click', async () => {
  const list = readWeights();
  const gone = S.grades.components.filter(c => !list.some(x => x.name === c.name))
    .filter(c => S.grades.items.some(i => i.component === c.name));
  if (gone.length && !confirm(
      `${gone.map(c => c.name).join(', ')} still ${gone.length === 1 ? 'has' : 'have'} marks recorded.\n\n` +
      `Removing ${gone.length === 1 ? 'it' : 'them'} here leaves those marks in the sheet but out of every total.`)) return;

  $('savew').disabled = true;
  const data = await post('saveComponents', Object.assign(where(), { components: list }));
  $('savew').disabled = false;
  if (data.ok) {
    S.grades = null; note('Saved.', 'good');
    $('weights').hidden = true; $('editw').textContent = 'Adjust weights';
    loadGrades();
  } else note(esc(data.error || 'Could not save those weights.'), 'bad');
});

/* ---- marks CSV -------------------------------------------------------- */
$('mcsv').addEventListener('click', () => {
  const g = S.grades;
  if (!g || !g.components.length) return;
  const c = course();

  const head = ['Roll','Name']
    .concat(g.items.map(i => `${i.component} - ${i.item} (of ${i.max})`))
    .concat(g.components.map(x => `${x.name} (of ${round(Number(x.marks)||0)})`))
    .concat(['Earned','Out of','Percentage','Grade','Point']);

  const rolls = S.roster.map(s => s.roll);
  Object.keys(g.scores).forEach(r => { if (rolls.indexOf(r) === -1) rolls.push(r); });

  const body = rolls.sort((a,b) => a.localeCompare(b, undefined, {numeric:true})).map(roll => {
    const r = grade(roll);
    const lg = letter(r.pct);
    return [roll, nameFor(roll)]
      .concat(g.items.map(i => { const v = (g.scores[roll]||{})[i.key]; return v === undefined ? '' : v; }))
      .concat(g.components.map(x => r.per[x.name] === null ? '' : round(r.per[x.name])))
      .concat([round(r.earned), round(r.assessed),
               r.pct === null ? '' : round(r.pct), lg.grade,
               lg.point === null ? '' : lg.point.toFixed(2)]);
  });

  const csv = [head].concat(body)
    .map(l => l.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff' + csv], { type:'text/csv' }));
  a.download = `${c.code.replace(/\s+/g,'')}-${c.section}-marks.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
});

/* ---------- save a whole sitting --------------------------------------- */
$('save').addEventListener('click', () => send(false));

async function send(overwrite) {
  if (S.busy) return;
  const c = course();
  if (!c || !$('date').value) { note('Pick a course and a date first.', 'bad'); return; }

  S.busy = true; $('save').disabled = true; $('save').textContent = 'Saving…'; note('');
  const cls = $('cls').value;

  try {
    const data = await post('save', Object.assign(where(), {
      overwrite, cls, date: $('date').value,
      records: S.roster.map(s => ({ roll: s.roll, name: s.name, status: FULL[S.marks[s.roll]] }))
    }));

    if (data.code === 'ALREADY_SAVED') {
      if (confirm(`${c.code}, class ${cls} on ${$('date').value} is already recorded. Replace it?`)) {
        S.busy = false; reset(); return send(true);
      }
      note('Kept the earlier record. Nothing was changed.');
    } else if (data.ok) {
      S.history = null;   // the reports are now out of date
      note(`Saved ${data.saved} students — ${esc(c.code)}, class ${cls} on ${$('date').value}.` +
           (data.replaced ? ' The earlier record was replaced.' : ''), 'good');
    } else {
      note(esc(data.error || 'The sheet rejected this save.'), 'bad');
    }
  } catch (err) {
    note('Save failed — your marks are still on screen, so try again once you have a connection.<br><code>' + esc(err.message) + '</code>', 'bad');
  } finally {
    S.busy = false; reset();
  }
}

function reset() { $('save').disabled = !S.roster.length; $('save').textContent = 'Save'; }

load();
</script>
